<div class="chatbot-container">
    <!-- Chat Button -->
    <button class="chat-button" (click)="toggleChat()">
        <i class="fas" [class.fa-comments]="!isOpen" [class.fa-times]="isOpen"></i>
    </button>

    <!-- Chat Window -->
    <div class="chat-window" [style.transform]="isOpen ? 'scale(1)' : 'scale(0)'" [style.opacity]="isOpen ? '1' : '0'">
        <div class="chat-header">
            <h3>Trợ lý cầu lông AI</h3>
            <button (click)="toggleChat()" style="background:none; border:none; color:white; cursor:pointer;">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>

        <div class="chat-messages" #scrollContainer>
            <div *ngFor="let msg of messages" class="message" [ngClass]="msg.role">
                <div [innerHTML]="msg.content"></div>
            </div>
            <div *ngIf="isTyping" class="typing-indicator">AI đang trả lời...</div>
        </div>

        <div class="chat-input">
            <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Hỏi tôi về đặt sân, kỹ thuật..." [disabled]="isTyping">
            <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
