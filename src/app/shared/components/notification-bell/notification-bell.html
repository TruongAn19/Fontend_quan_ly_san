<div class="notif-bell-host">
  <button class="bell-trigger" (click)="toggle()" [class.has-unread]="unread() > 0" aria-label="Thông báo">
    🔔
    @if (unread() > 0) {
      <span class="badge">{{ unread() > 99 ? '99+' : unread() }}</span>
    }
  </button>

  @if (isOpen()) {
    <div class="bell-dropdown">
      <div class="dropdown-header">
        <strong>Thông báo</strong>
        @if (unread() > 0) {
          <button class="link-btn" (click)="markAllRead()">Đánh dấu tất cả đã đọc</button>
        }
      </div>

      @if (isLoading()) {
        <div class="empty">Đang tải...</div>
      } @else if (items().length === 0) {
        <div class="empty">Không có thông báo</div>
      } @else {
        <ul class="notif-list">
          @for (n of items(); track n.id) {
            <li class="notif-item" [class.unread]="!(n.isRead || n.read)" (click)="onItemClick(n)">
              <div class="notif-title">{{ title(n) }}</div>
              <div class="notif-message">{{ n.message }}</div>
              <div class="notif-time">{{ relativeTime(n.createdAt) }}</div>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
