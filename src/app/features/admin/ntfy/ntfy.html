<div class="admin-ntfy animate-fade-in">
  <h1 class="page-title">Hệ thống Thông báo Realtime (NTFY)</h1>

  @if (errorMessage()) {
    <div class="error-alert">
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <div class="grid-layout">
    
    <div class="left-column glass-card">
      <h3 class="card-title">Gửi thông báo hệ thống</h3>
      
      <form [formGroup]="notifyForm" (ngSubmit)="onSubmit()" class="premium-form">
        <div class="form-group">
          <label for="message">Nội dung thông báo</label>
          <textarea id="message" formControlName="message" rows="4" placeholder="Nhập thông báo gửi tới tất cả người dùng..."></textarea>
        </div>

        <button type="submit" class="btn-submit" [disabled]="notifyForm.invalid || isSending()">
          @if (isSending()) {
            <span class="spinner"></span> Đang gửi...
          } @else {
            Gửi Broadcast
          }
        </button>
      </form>
    </div>

    <div class="right-column glass-card">
      <div class="header-row">
        <h3 class="card-title">Theo dõi Topic</h3>
        <div class="topic-picker">
          <input #topicInput type="text" [value]="topic()" placeholder="Tên topic..." />
          <button class="btn-topic" (click)="changeTopic(topicInput.value)">Đổi</button>
        </div>
      </div>

      <p class="topic-status">Đang lắng nghe: <code>/ntfy-sse/{{ topic() }}</code></p>

      <div class="feed-box">
        @if (messages().length === 0) {
          <p class="empty-feed">Chưa có sự kiện nào phát sinh.</p>
        } @else {
          <div class="feed-item animate-fade-in" *ngFor="let msg of messages()">
            <p class="feed-text">{{ msg }}</p>
          </div>
        }
      </div>
    </div>

  </div>
</div>
