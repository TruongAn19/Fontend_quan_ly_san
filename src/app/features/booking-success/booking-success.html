<div class="success-container animate-fade-in">
  <div class="glass-card">

    <div class="icon-circle success">
      <span class="icon">✔</span>
    </div>

    <h2>Đặt sân thành công!</h2>
    <p>{{ message() }}</p>

    <div class="booking-info">
      <div class="info-row">
        <span class="label">Mã đặt sân</span>
        <span class="value code">{{ bookingCode() }}</span>
      </div>
      @if (bookingId()) {
        <div class="info-row">
          <span class="label">ID đơn đặt</span>
          <span class="value">#{{ bookingId() }}</span>
        </div>
      }
    </div>

    <div class="action-group">
      <a routerLink="/" class="btn-primary">Quay về Trang chủ</a>
      <a routerLink="/booking-history" class="btn-secondary">Xem Lịch sử Đặt sân</a>
    </div>

  </div>
</div>
