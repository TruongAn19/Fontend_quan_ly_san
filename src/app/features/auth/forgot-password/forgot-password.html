<div class="forgot-container">
  <div class="glass-card animate-fade-in">
    <h1 class="premium-title">Quên mật khẩu</h1>
    <p class="premium-subtitle">Nhập email của bạn để nhận link đặt lại mật khẩu</p>

    @if (errorMessage()) {
      <div class="error-alert">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="success-alert">
        <span>{{ successMessage() }}</span>
      </div>
    }

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="premium-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="name@example.com"
          [class.invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
        />
        @if (forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched) {
          <span class="validation-error">Vui lòng nhập email hợp lệ</span>
        }
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading() || successMessage()">
        @if (isLoading()) {
          <span class="spinner"></span> Đang xử lý...
        } @else {
          <span>Gửi link</span>
        }
      </button>
    </form>

    <div class="form-footer">
      <p>Quay lại <a routerLink="/login">Đăng nhập</a></p>
    </div>
  </div>
</div>
