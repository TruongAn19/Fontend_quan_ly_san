<div class="login-container animate-fade-in">
  
  <!-- Left Side: Banner -->
  <div class="login-banner">
    <div class="banner-logo">
      <div class="logo-shield">🛡️</div>
      <span>GoalField</span>
    </div>
    <h1 class="banner-title">
      Quan ly san bong da
      <span class="highlight">chuyen nghiep, hien dai</span>
    </h1>
    <p class="banner-desc">
      Đặt sân, ghép kèo, thuê thiết bị và thanh toán tất cả trên một nền tảng duy nhất.
    </p>
  </div>

  <!-- Right Side: Form -->
  <div class="login-form-area">
    <div class="form-header">
      <h2 class="form-title">Chào mừng trở lại!</h2>
      <p class="form-subtitle">Đăng nhập để quản lý lịch đặt sân của bạn</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="you@example.com" [(ngModel)]="loginRequest.email" name="email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input type="password" class="form-input" placeholder="••••••••" [(ngModel)]="loginRequest.password" name="password" required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox"> Ghi nhớ đăng nhập
        </label>
        <a routerLink="/forgot-password" class="forgot-password">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-login">Đăng nhập</button>

      <div class="divider">hoặc</div>

      <button type="button" class="btn-social">
        <img src="https://www.google.com/favicon.ico" alt="Google" width="18">
        Tiếp tục với Google
      </button>

      <p class="register-link">
        Chưa có tài khoản? <a routerLink="/register">Đăng ký ngay</a>
      </p>
    </form>
  </div>

</div>
