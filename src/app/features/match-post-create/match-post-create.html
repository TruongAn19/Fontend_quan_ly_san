<div class="create-container animate-fade-in">
  
  @if (errorMessage()) {
    <div class="error-alert">
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <div class="glass-card form-card">
    <h1 class="section-title">Tạo bài ghép sân</h1>
    
    <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="premium-form">
      
      <div class="form-group">
        <label for="area">Khu vực (Quận/Huyện)</label>
        <input type="text" id="area" formControlName="area" placeholder="VD: Thu Duc" [class.invalid]="createForm.get('area')?.invalid && createForm.get('area')?.touched" />
      </div>

      <div class="form-group">
        <label for="playDate">Ngày chơi</label>
        <input type="date" id="playDate" formControlName="playDate" [class.invalid]="createForm.get('playDate')?.invalid && createForm.get('playDate')?.touched" />
      </div>

      <div class="form-group">
        <label for="timeSlot">Khung giờ</label>
        <input type="text" id="timeSlot" formControlName="timeSlot" placeholder="VD: 18:00-20:00" [class.invalid]="createForm.get('timeSlot')?.invalid && createForm.get('timeSlot')?.touched" />
      </div>

      <div class="form-group">
        <label for="skillLevel">Trình độ yêu cầu</label>
        <select id="skillLevel" formControlName="skillLevel">
          <option value="Beginner">Mới chơi (Beginner)</option>
          <option value="Intermediate">Trung bình (Intermediate)</option>
          <option value="Advanced">Khá tốt (Advanced)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="maxParticipants">Số người tối đa</label>
        <input type="number" id="maxParticipants" formControlName="maxParticipants" min="2" />
      </div>

      <div class="form-group">
        <label for="description">Mô tả chi tiết</label>
        <textarea id="description" formControlName="description" rows="4" placeholder="Chi phí dự kiến, số lượng người hiện tại..." [class.invalid]="createForm.get('description')?.invalid && createForm.get('description')?.touched"></textarea>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner"></span> Đang tạo...
        } @else {
          Tạo bài đăng
        }
      </button>

    </form>
  </div>

</div>
